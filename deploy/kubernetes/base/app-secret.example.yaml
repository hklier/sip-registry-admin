# Create the equivalent secrets outside Git. These examples must never be applied unchanged.
apiVersion: v1
kind: Secret
metadata:
  name: sip-registry-admin-auth
  namespace: sip-registry-admin
type: Opaque
stringData:
  ADMIN_USERNAME: registry-admin
  ADMIN_PASSWORD: CHANGE_ME_TO_A_LONG_UNIQUE_PASSWORD
---
apiVersion: v1
kind: Secret
metadata:
  name: sip-registry-admin-db
  namespace: sip-registry-admin
type: Opaque
stringData:
  mariadb-credentials: |-
    database-host
    database-username
    database-password
